<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4da1"/>
      <stop offset="100%" stop-color="#0a1a42"/>
    </linearGradient>
  </defs>

  <!-- Background: dark blue rounded square -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Waveform: 6 half-cycles, x=8..56, centered at x=32, y=18, amplitude=9 -->
  <path d="M8,18 C8,9 16,9 16,18 C16,27 24,27 24,18
           C24,9 32,9 32,18 C32,27 40,27 40,18
           C40,9 48,9 48,18 C48,27 56,27 56,18"
        fill="none" stroke="#64b5f6" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Text file symbol: page body with dog-ear fold at top-right -->
  <!-- Page: M17,33 L40,33 L48,41 L48,58 L17,58 Z -->
  <polygon points="17,33 40,33 48,41 48,58 17,58"
           fill="#e8eaf6" stroke="none"/>

  <!-- Fold triangle (dog-ear): fold corner M40,33 L48,41 L40,41 Z -->
  <polygon points="40,33 48,41 40,41"
           fill="#9fa8da" stroke="none"/>

  <!-- Text lines inside file: equal ~4px margin top and bottom of content area y=41..58 -->
  <!-- Short title line at top (y=45), two full lines below (y=50, y=55) -->
  <line x1="22" y1="45" x2="36" y2="45" stroke="#5c6bc0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="44" y2="50" stroke="#5c6bc0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="22" y1="55" x2="44" y2="55" stroke="#5c6bc0" stroke-width="2.2" stroke-linecap="round"/>
</svg>
