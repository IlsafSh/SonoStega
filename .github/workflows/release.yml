name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release Windows (MSVC)
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade aqtinstall

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Prepare Deployment Folder
        run: |
          mkdir deploy
          copy build\SonoStega.exe deploy\
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler deploy\SonoStega.exe

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path deploy\* -DestinationPath SonoStega_Portable_${{ github.ref_name }}.zip

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup_script.iss
          Move-Item SonoStega_Setup.exe SonoStega_Setup_${{ github.ref_name }}.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SonoStega_Portable_${{ github.ref_name }}.zip
            SonoStega_Setup_${{ github.ref_name }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
